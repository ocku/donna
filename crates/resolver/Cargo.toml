[package]
name = "resolver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ocku"]
publish = false

[dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"
dns = { path = "../dns" }
rand = "0.9.2"
smallvec = "1.15"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tracing = "0.1.44"
transport = { path = "../transport" }

[dev-dependencies]
rsa = { version = "0.9.10", features = ["sha2"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util", "time"] }
