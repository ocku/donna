// Isolated unsigned laboratory only, matching the Donna recursive example.
// Production validation settings must not be derived from this fixture.
options {
    directory "/tmp";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 172.29.53.0/24; 127.0.0.1; };
    dnssec-validation no;
    empty-zones-enable no;
    max-cache-size 64m;
    minimal-responses yes;
};
zone "." { type hint; file "/suite/cache-root.hints"; };
