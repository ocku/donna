[package]
name = "donna"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ocku"]
publish = false
description = "DNS client, recursive and forwarding resolver, and authoritative daemon"

[workspace]
members = ["crates/dns", "crates/transport", "crates/resolver", "crates/nameserver"]
exclude = ["vendor/quinn-proto"]
resolver = "3"

[patch.crates-io]
# Keep QUIC packet padding from exhausting congestion credit on ACK-only traffic.
# See vendor/quinn-proto/README.donna for the upstream version and patch scope.
quinn-proto = { path = "vendor/quinn-proto" }

[dependencies]
anyhow = "1"
base64ct = { version = "1.8", features = ["alloc"] }
data-encoding = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "1"
getrandom = "0.4"
tracing = "0.1"
nameserver = { path = "crates/nameserver" }
dns = { path = "crates/dns" }
resolver = { path = "crates/resolver" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
transport = { path = "crates/transport", features = ["tcp", "udp", "tls", "doh", "doq", "dnscrypt"] }

[dev-dependencies]
crypto_box = { version = "0.9", default-features = false, features = ["std"] }
ed25519-dalek = "3"

[profile.release]
lto = "thin"
codegen-units = 1
